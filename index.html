<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <script src="scripts.js" defer></script>
    <title>Etch-A-Sketch</title>
</head>
<body>
    <div id="main">
        <div class="settings">
            <input id="colorPicker" type="color">
            <button>not colour</button>
            <button>colour</button>
            <button>eraser</button>
            <button>clear</button>
            <div>
                <input onchange=updateGridSize(this) type="range" name="Grid size" id="gridSize" min="16" max="64">
                <label for="gridSize">Grid size</label>
            </div>
        </div>
        <div id="gridWrapper"></div>
    </div>
    <script>

        function setUpDrawingArea(gridSize = 16) {
        for (let i = 0; i < gridSize; i++){
            let column = document.createElement("div");
            column.id = "column";
            column.style.backgroundColor = "black";
            gridWrapper.appendChild(column);
        }

            let columnList = document.querySelectorAll("#column");
            let columnArray = Array.from(columnList);
            columnArray.forEach(column => {
                for (let j = 0; j < gridSize; j++){
                    let row = document.createElement("div");
                    row.id = "row";
                    row.style.width=`${drawingAreaSize/gridSize}px`;
                    row.style.height=`${drawingAreaSize/gridSize}px`;
                    row.style.backgroundColor = "white";
                    row.addEventListener("mouseover",() => {
                        row.style.opacity = 0.5;
                    })
                    row.addEventListener("mouseout",() => {
                        row.style.opacity = 1;
                    })
                    row.addEventListener("mouseover",changeColor);
                    column.appendChild(row);
                }
            })
        }

        function updateGridSize(size) {
            while (gridWrapper.firstChild) {
                gridWrapper.removeChild(gridWrapper.lastChild);
            }
            setUpDrawingArea(size.value)
        }

        function changeColor(e) {
        if (!mouseDown) return
        e.preventDefault()
        let color = document.getElementById("colorPicker").value
        e.target.style.backgroundColor = color;
        }
        
        document.addEventListener("dragstart", e => e.preventDefault());

        let mouseDown = false
        document.body.onmousedown = () => (mouseDown = true)
        document.body.onmouseup = () => (mouseDown = false)

        let gridSize = document.getElementById("gridSize");

        let gridWrapper = document.getElementById("gridWrapper");
        let drawingAreaSize = window.getComputedStyle(gridWrapper).getPropertyValue("width").replace("px","");
        
        setUpDrawingArea(16);


    </script>
</body>
</html>
