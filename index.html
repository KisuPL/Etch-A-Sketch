<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <script src="scripts.js" defer></script>
    <title>Etch-A-Sketch</title>
</head>
<body>
    <div id="main">
        <div class="settings">
            <input id="colorPicker" type="color">
            <button id="rainbowButton" class="toggleable">Rainbow mode</button>
            <button id="eraserButton" class="toggleable">Eraser</button>
            <button id="clearButton">Clear</button>
            <div class="gridSizeSettings">
                <label for="gridSize">Grid size</label>
                <input type="range" name="Grid size" id="gridSize" value=16 min="8" max="64" oninput="this.nextElementSibling.value = this.value" onchange=updateGridSize()>
                <output>16</output>
            </div>
        </div>
        <div id="gridWrapper"></div>
    </div>

</body>
</html>
